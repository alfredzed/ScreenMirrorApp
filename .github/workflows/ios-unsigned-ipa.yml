name: Build unsigned iPad IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ipad-client
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        working-directory: ipad-client
        run: |
          xcodebuild \
            -project ScreenMirrorApp.xcodeproj \
            -scheme ScreenMirrorApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        working-directory: ipad-client
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenMirrorApp.app Payload/
          zip -qry "ScreenMirrorApp-unsigned-${GITHUB_RUN_NUMBER}.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirrorApp-unsigned-ipa
          path: ipad-client/ScreenMirrorApp-unsigned-*.ipa
          if-no-files-found: error
